name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Enable VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # VNC legacy chỉ đọc 8 ký tự đầu, dài hơn sẽ bị cắt im lặng
          if [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo "VNC_PASSWORD phải tối đa 8 ký tự"
            exit 1
          fi

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all

          echo "Console user: $(stat -f%Su /dev/console)"
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "Không có gì lắng nghe port 5900"

      - name: Keep Session Alive
        run: |
          echo "=== Mac is ready ==="
          echo "Tailscale IP:"
          tailscale ip -4
          sleep 21600
